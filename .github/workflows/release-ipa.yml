name: Release iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile iOS app
        run: |
          set -o pipefail
          xcodebuild -project TamilTunes.xcodeproj -scheme TamilTunes -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for testing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TamilTunes.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/dist/TamilTunes-unsigned.ipa" Payload
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamilTunes-unsigned-ipa
          path: dist/TamilTunes-unsigned.ipa
          if-no-files-found: error
      - name: Publish downloadable build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TITLE="TamilTunes Build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})"
          gh release create "$TAG" dist/TamilTunes-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Automated build from main at commit ${GITHUB_SHA}. This IPA is UNSIGNED and cannot be installed directly on a standard iPhone." \
            --prerelease
