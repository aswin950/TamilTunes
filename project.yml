name: TamilTunes
options:
  bundleIdPrefix: com.tamiltunes
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  TamilTunes:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: TamilTunes
    info:
      path: TamilTunes/Info.plist
      properties:
        CFBundleDisplayName: TamilTunes
        SpotifyClientID: "$(SPOTIFY_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: com.tamiltunes.spotify
            CFBundleURLSchemes:
              - tamiltunes
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamiltunes.app
        SPOTIFY_CLIENT_ID: ''
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  TamilTunes:
    build:
      targets:
        TamilTunes: all
